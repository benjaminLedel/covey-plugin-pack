name: build

# The pack is a module of its own now, and that is exactly why it needs a
# pipeline: nothing else compiles it any more. Before the split, a broken plugin
# failed Covey's own build; today Covey pins a released version and would not
# notice for weeks.
#
# The job that matters most is the last one — building against the SDK's main
# branch. It answers "did a change to the contract just break the plugins?"
# while the change is still somebody's pull request, not after it is tagged.

on:
  push:
  pull_request:
  # The contract can break the plugins without anybody touching this repository,
  # so check it on a schedule too.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

      # A plugin package that nobody blank-imports still has to REGISTER itself
      # when it is imported — that is the whole contract. This builds a binary
      # that imports every package in the pack, so a missing or duplicate
      # Register shows up here rather than in an operator's store.
      - name: Every plugin registers itself
        run: |
          set -euo pipefail
          mkdir -p /tmp/regcheck && cd /tmp/regcheck
          # printf, not a heredoc: inside a YAML block the heredoc body keeps
          # its indentation, and a go.mod with leading spaces is not a go.mod.
          printf 'module regcheck\n\ngo 1.24\n' > go.mod
          {
            echo 'package main'
            echo
            echo 'import ('
            echo '  "fmt"'
            echo '  "os"'
            echo '  "github.com/benjaminLedel/covey-plugin-sdk/target"'
            for d in $(cd "$GITHUB_WORKSPACE" && go list ./... | grep -v '/manifests'); do
              echo "  _ \"$d\""
            done
            echo ')'
            echo
            echo 'func main() {'
            echo '  seen := map[string]bool{}'
            echo '  for _, d := range target.All() {'
            echo '    if seen[d.Name] { fmt.Println("duplicate registration:", d.Name); os.Exit(1) }'
            echo '    seen[d.Name] = true'
            echo '    if d.System == nil { fmt.Println("registered without a System:", d.Name); os.Exit(1) }'
            echo '    fmt.Println(" ", d.Name, "-", d.Category)'
            echo '  }'
            echo '  fmt.Println(len(seen), "plugin(s) registered")'
            echo '  if len(seen) == 0 { os.Exit(1) }'
            echo '}'
          } > main.go
          go mod edit -replace github.com/benjaminLedel/covey-plugin-pack="$GITHUB_WORKSPACE"
          go mod edit -require github.com/benjaminLedel/covey-plugin-pack@v0.0.0
          GOFLAGS=-mod=mod go mod tidy
          go run .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-latest, and this job is where it carries the weight: without it
      # setup-go takes the version preinstalled on the runner image as soon as
      # that one matches the "1.26" line — and it is a patch release behind
      # after every Go release. govulncheck checks the standard library of the
      # toolchain it builds with, so the run then fails at something that is
      # not in the source at all (go1.26.5 → five findings, every one of them
      # "Fixed in go1.26.6"). Covey's own pipeline ran into this first; the
      # pack inherits the answer rather than the surprise.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      # The same two tools Covey itself runs, and they matter more here, not
      # less: this code talks to other people's systems with other people's
      # credentials, and it is linked into every Covey that ships.
      #
      # govulncheck reports only what the code actually CALLS — almost no false
      # positives, so it is a hard step. Pinned on purpose: a tool fetched fresh
      # from the network on every run is itself a way in.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # gosec complements it: the one knows published holes in DEPENDENCIES, the
      # other looks for patterns in our OWN code. With an explicit rule list
      # rather than "everything except…", because unfiltered it reports what
      # these plugins are FOR — the dev plugin runs shell commands, the file
      # plugins read paths. A job that prints a hundred findings gets clicked
      # away, and then it protects nobody.
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 \
            -include=G101,G102,G106,G107,G108,G109,G110,G201,G202,G203,G303,G305,G401,G402,G403,G404,G501,G502,G503,G504,G505 \
            -exclude-dir=.go ./...

  manifests:
    name: lint the manifest plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifests here are checked by the same binary that installs them.
      # Until a Covey release ships `covey plugin lint`, this reports and passes
      # rather than pretending to check something.
      - name: Fetch the covey binary
        id: covey
        run: |
          set -euo pipefail
          url=$(curl -sSL https://api.github.com/repos/benjaminLedel/covey/releases/latest \
                | python3 -c 'import json,sys; r=json.load(sys.stdin); print(next((a["browser_download_url"] for a in r.get("assets",[]) if a["name"].endswith("linux-amd64")), ""))')
          if [ -z "$url" ]; then
            echo "::notice::no covey release asset yet — skipping the manifest lint"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sSL -o /usr/local/bin/covey "$url"
          chmod +x /usr/local/bin/covey
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Lint
        if: steps.covey.outputs.available == 'true'
        run: covey plugin lint manifests/*.json

  against-sdk-main:
    name: build against the SDK's main branch
    runs-on: ubuntu-latest
    # Informational: a contract change that breaks the plugins should be visible
    # immediately, but it must not block a pull request in THIS repository —
    # the fix belongs in the SDK or in a coordinated release, not in a red tick
    # on somebody's unrelated change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Point at the SDK's main and build
        run: |
          set -euo pipefail
          GOFLAGS=-mod=mod go get github.com/benjaminLedel/covey-plugin-sdk@main
          go build ./...
          go test ./... -count=1
